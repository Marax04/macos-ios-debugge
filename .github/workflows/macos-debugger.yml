name: macOS debugger

# Why this exists
# ---------------
# `rustre-debug` supports three backends, and two of them are verified by
# running them: Windows and Linux each have live tests that drive a real
# process. macOS has NEVER been executed — only compiled and inspected — which
# makes it the backend most likely to drift, and the project's STATUS.md lists
# that as its main limitation.
#
# These runners close exactly that gap: macos-15-intel is Intel (x86_64) and
# macos-14 is Apple Silicon (aarch64), so both halves of the macOS backend get
# compiled AND run on real hardware and a real kernel.
#
# Status as of 2026-08-15: the aarch64 half HAS now run, and the debugger's own
# suite passed on it — the first time this backend was ever executed. The Intel
# half has not: see the runner-label note in the matrix below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A debugger's tests are timing-sensitive; a backtrace on failure is what
  # makes a red CI run actionable instead of just red.
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hung ptrace/Mach wait must not burn a whole runner hour: the Linux work
    # in this project already produced tests that hang rather than fail, so the
    # ceiling is deliberate.
    timeout-minutes: 45
    strategy:
      # One architecture failing must not cancel the other: knowing whether a
      # defect is Intel-only or ARM-only is half the diagnosis.
      fail-fast: false
      matrix:
        include:
          # `macos-15-intel`, not `macos-13`.
          #
          # Measured, not assumed: with `macos-13` this row sat "queued" through
          # every run of 2026-08-14/15 and never once started, while the two
          # arm64 jobs and the iOS jobs completed repeatedly. GitHub retired the
          # macos-13 image, so the label is accepted at parse time and then
          # never scheduled — which is worse than a failure, because a job that
          # never reports also never tells you it will not.
          - os: macos-15-intel
            name: macOS Intel (x86_64)
            target: x86_64-apple-darwin
          - os: macos-14
            name: macOS Apple Silicon (aarch64)
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Pin Python for the same reason the Rust toolchain is pinned.
      #
      # Measured, not guessed: the first macOS run failed here —
      #   error: failed to run custom build command for `pyo3-ffi v0.23.5`
      #   error: the configured Python interpreter version (3.14) is newer than
      #          PyO3's maximum supported version (3.13)
      # `pyo3 0.23` is a dependency of rustre-plugin-python and
      # rustre-script-python, both of which rustre-mcp-tools pulls in, so
      # whatever Python the runner image happens to ship decides whether this
      # workspace builds at all. That is not a property a build should have.
      #
      # 3.13 is the newest version pyo3 0.23 supports. Raising this pin is
      # blocked on upgrading pyo3, which is a source change across three crates
      # and separate work — the pin makes the build reproducible today rather
      # than hiding that.
      - name: Pin Python to a version PyO3 0.23 supports
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Show host facts
        run: |
          echo "arch:    $(uname -m)"
          echo "kernel:  $(uname -r)"
          echo "rustc:   $(rustc -vV | tr '\n' ' ')"
          sysctl -n machdep.cpu.brand_string || true

      # ── 1. It has to build, in release, exactly as the other two do ────────
      - name: Build (release)
        run: cargo build --release -p rustre-debug --target ${{ matrix.target }}

      # ── 2. The suite. This is the step that has never run before ───────────
      #
      # `--test-threads=1` for the same reason the Linux runs need it: several
      # tests drive a real traced process, and two of those in parallel fight
      # over the same debug registers and wait queues.
      - name: Test (release, serial)
        run: cargo test --release -p rustre-debug --lib --target ${{ matrix.target }} -- --test-threads=1

      # ── 2b. The LIVE tests — a real child process, real ptrace + Mach ──────
      #
      # In their own step, and under sudo, for one reason: `task_for_pid` needs
      # root or the debugger entitlement on modern macOS. `resolve_task_port`
      # has said so in its error text for a long time; whether it holds on a
      # stock runner has never been measured, and this is the step that
      # measures it.
      #
      # sudo is scoped to HERE rather than applied to the whole suite: running
      # every test as root would change `$HOME` and with it the symbol-cache
      # path, so a privilege needed by four tests would quietly alter the
      # environment of two thousand.
      #
      # `-E env PATH=$PATH` because sudo resets PATH and would not find cargo.
      #
      # `continue-on-error` because this backend has never executed: the first
      # run is a MEASUREMENT of which assumption is wrong, and a red here must
      # not mask the compile-and-unit-test result above, which is a different
      # question. Remove the flag once the live tests pass — leaving it after
      # that turns a measurement into an ignored alarm.
      - name: Live tests (root — task_for_pid requires it)
        continue-on-error: true
        run: |
          sudo -E env "PATH=$PATH" cargo test --release -p rustre-debug --lib \
            --target ${{ matrix.target }} -- --test-threads=1 live_tests

      # ── 3. The MCP surface, which is what a user actually calls ────────────
      - name: Test rustre-mcp-tools
        run: cargo test --release -p rustre-mcp-tools --lib --target ${{ matrix.target }}

      # ── 4. The cross-checks the Windows host cannot do ─────────────────────
      #
      # Clippy on the macOS backend specifically: the file compiles on this
      # host today only because `cargo check --target` is run, which does not
      # lint. Warnings here are informative, not fatal — a lint failure must
      # not hide a real test failure above.
      - name: Clippy (informational)
        continue-on-error: true
        run: cargo clippy --release -p rustre-debug --target ${{ matrix.target }} -- -W clippy::all

  # ── iOS ────────────────────────────────────────────────────────────────────
  #
  # What this job can and cannot prove, stated up front so a green tick is not
  # read as more than it is:
  #
  #   CAN   — that `src/ios` (30 739 lines, 502 tests) COMPILES for the two iOS
  #           triples. It never has: `grep -r apple-ios` over this repo returned
  #           nothing, so iOS has been a backend without ever being a target.
  #   CAN   — that a real `debugserver` exists and answers, which is the one
  #           thing `mock_debugserver.rs` structurally cannot check: the mock
  #           proves we speak the protocol as WE understood it, not that Apple's
  #           implementation agrees.
  #   CANNOT — anything about iOS itself. The Simulator runs the HOST's macOS
  #           kernel; its processes are macOS processes with an iOS userland.
  #           Device-level behaviour needs physical hardware and a self-hosted
  #           runner, and no configuration of GitHub-hosted Actions reaches it.
  ios:
    name: iOS ${{ matrix.name }}
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device triple (compile only)
            target: aarch64-apple-ios
            simulator: false
          - name: simulator
            target: aarch64-apple-ios-sim
            simulator: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ios-${{ matrix.target }}-cargo-

      # This step is NOT allowed to fail. It is the whole point of the job:
      # a backend that cannot be built for its own platform is not a backend.
      - name: Build for ${{ matrix.target }}
        run: cargo build --release -p rustre-debug --target ${{ matrix.target }}

      # ── Boot FIRST. This ordering is not cosmetic ──────────────────────────
      #
      # The first run of this workflow put the test step before this one and
      # the tests failed. A test binary built for `aarch64-apple-ios-sim` is
      # not a macOS executable: cargo cannot simply exec it, and there was no
      # booted device to run it on either. Booting has to happen before the
      # thing that needs a booted device.
      #
      # `continue-on-error` because a simulator that fails to boot is Xcode's
      # problem, not this project's — but note what that flag does NOT do: it
      # lets the JOB continue, it does not make later steps run if this one
      # hard-fails in a way that stops the job. The runtime list is printed so
      # a missing runtime image is visible in the log rather than inferred.
      - name: Boot a simulator
        id: sim
        if: matrix.simulator
        continue-on-error: true
        run: |
          set -x
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl create rustre-ci "iPhone 15" 2>/dev/null \
                || xcrun simctl create rustre-ci "iPhone 14" 2>/dev/null \
                || xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(iter([x["udid"] for v in d.values() for x in v]),""))')
          echo "device=$DEVICE" | tee -a "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true

      # `debugserver` is the counterpart of `src/ios/mock_debugserver.rs`, and
      # the one thing the mock structurally cannot check: the mock proves we
      # speak the protocol as WE understood it, not that Apple's implementation
      # agrees. Locating it is the first step of ever driving the real one.
      - name: Locate debugserver
        if: matrix.simulator
        continue-on-error: true
        run: |
          find "$(xcode-select -p)" -name debugserver -type f 2>/dev/null | head -5
          ls -l /Library/Developer/CoreSimulator/Profiles/Runtimes 2>/dev/null || true

      # The 502 iOS tests are host-independent by design (see src/ios/mod.rs:
      # nothing is gated on `cfg(target_os = "macos")`), so they already run on
      # Windows and Linux. Running them HERE adds one fact those runs cannot
      # give: that they also hold when compiled by the Apple toolchain for an
      # Apple triple, where integer widths, alignment and ABI are its own.
      #
      # The runner env var is what makes that possible at all: without it cargo
      # tries to exec an iOS-simulator binary on macOS directly, which is not a
      # thing that can work. `simctl spawn` runs it on the booted device.
      - name: Test on the simulator
        if: matrix.simulator
        env:
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER: xcrun simctl spawn booted
        run: cargo test --release -p rustre-debug --lib --target ${{ matrix.target }} -- --test-threads=1

      - name: Shut the simulator down
        if: matrix.simulator && always()
        continue-on-error: true
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete rustre-ci || true

  # A short summary job so the repository's badge/checks answer one question:
  # did the macOS backend run, on both architectures?
  #
  # `ios` is in `needs` so the job is ordered and reported, but only the macOS
  # result is asserted: the iOS job is new and its Simulator half is explicitly
  # best-effort, so gating the whole workflow on it would make the signal that
  # matters — macOS executed, at last — hostage to the one that does not yet.
  summary:
    name: macOS verified
    runs-on: ubuntu-latest
    needs: [macos, ios]
    if: always()
    steps:
      - name: Report
        run: |
          echo "macOS job result: ${{ needs.macos.result }}"
          echo "iOS   job result: ${{ needs.ios.result }}  (informational)"
          test "${{ needs.macos.result }}" = "success"
