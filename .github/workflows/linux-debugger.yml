name: Linux debugger

# Why this exists
# ---------------
# Two gaps, one file.
#
# 1. Linux had NO CI at all. It was verified only on the maintainer's WSL, which
#    is x86_64 and reports "nested virtualization is not supported" on every
#    run — a single machine, one architecture, one kernel configuration. The
#    macOS workflow proved in one afternoon what a second environment finds that
#    inspection does not.
#
# 2. `linux_debugger.rs` is believed not to compile for aarch64: it reads
#    `libc::user_regs_struct`'s `rip`, a field that does not exist on ARM64,
#    where ptrace uses PTRACE_GETREGSET with a completely different struct
#    (`regs[31]`, `sp`, `pc`, `pstate`). That belief has never been MEASURED,
#    because this workspace cannot cross-check for aarch64-unknown-linux-gnu:
#    `libsqlite3-sys` needs a C cross-compiler that is not installed. A native
#    ARM runner answers it without cross-compiling anything.
#
# The second point matters beyond tidiness. `X86_TRAP_BYTE_IS_VALID_HERE`
# refuses every software breakpoint on ARM64 in all three backends, and the
# stated prerequisite for lifting that refusal is porting `read_regs` /
# `regs_to_register_set`. Until this job exists, "does Linux build on ARM?" is an
# assumption in a comment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── Concorrenza: un run per workflow per ramo ──────────────────────────────
#
# Misurato 2026-08-16: ELEVEN runs in flight at once — 5 Linux, 4 macOS, 2
# Windows — with the oldest at 77 minutes and still not finished. Four of the
# five Linux runs were measuring commits already superseded, competing for the
# same runner pool as the only one whose answer was wanted.
#
# The cost is not wasted minutes, it is that NOTHING COMPLETES. A feedback loop
# that never closes is worth the same as no CI, and this repo has spent whole
# rounds waiting on an ARM answer that was starving behind its own stale
# duplicates.
#
# THE TRADE-OFF, recorded rather than glossed: `cancel-in-progress` means a long
# row can be killed by the next push. The aarch64 row takes ~30-90 minutes and
# the measured push interval was ~13, so pushing at that rate would leave it
# never finishing. That is a limit on how OFTEN to push, not a reason to keep
# eleven runs racing: with the pool to itself the newest run is the one that
# gets to finish. Batch the rounds; let the row land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 90, not 45. Measured on 3e8cb04: the x86_64 row was CANCELLED at exactly
    # 45 minutes, part-way through `Test rustre-mcp-tools` — a cold release
    # build of this workspace plus two test runs does not fit in that. A job
    # killed by its own ceiling reads as a failure of the code, which is the
    # most expensive kind of false signal.
    # 90 -> 120. Raised ONCE, and the reason is recorded so nobody raises it
    # again reflexively: on 34cef08 the aarch64 row spent 87 minutes in
    # `Test (release, serial)` and was killed by the ceiling, where the same
    # step took 1.59 SECONDS one commit earlier. That was NOT slowness -- it was
    # a test of mine (574) that resumed the target waiting for a stop the kernel
    # never delivers on ARM. Fixed in 585.
    #
    # The ceiling is still raised, because the lesson of that run is what a
    # timeout costs: a job killed this way destroys the signal for every OTHER
    # test in it, so two unrelated fixes went unmeasured. Headroom is cheaper
    # than a lost measurement.
    #
    # If this row ever hits 120, do not raise it again: something is hanging,
    # and the number is hiding it.
    timeout-minutes: 120
    # An architecture failing must not cancel the other: knowing whether a
    # defect is x86-only or ARM-only is half the diagnosis.
    continue-on-error: ${{ matrix.expected_to_fail }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x86_64
            expected_to_fail: false
          # ── The measurement ──────────────────────────────────────────────
          #
          # `continue-on-error` here is NOT a way to ignore a failure. It is
          # used because this row is expected to be RED today for a documented
          # reason (the aarch64 register port has not been written), and a
          # workflow that is permanently red for a known gap trains people to
          # stop reading it.
          #
          # What it must never become is a silent skip: the summary job below
          # prints this result explicitly, so the gap is reported every run.
          #
          # DELETE this flag the moment the remaining two are understood. If it
          # is still here after that, the job has stopped being a measurement.
          #
          # WHAT THE PORT ACHIEVED (36dad1b, 2026-08-15). It used to fail at
          # `Build (release)` with 43 errors. It now fails at
          # `Test (release, serial)` with **1893 passed, 13 failed**, and every
          # unit test passes — the register port compiles and is structurally
          # right. The 13 are all LIVE tests, and they are not one problem:
          #
          #   6  expected refusals. `set_breakpoint` answers
          #      Unsupported("software breakpoints ... x86 int3 ..."), and
          #      `set_register(dr0)` answers "unknown register dr0". Those are
          #      the defences added in 548 and 552 working exactly as designed.
          #
          #   5  tests written for x86 asking a correct backend the wrong
          #      question: `rax`/`rip` on a register set that publishes
          #      x0-x30/sp/pc/pstate, and breakpoints at addresses that are not
          #      4-byte aligned. Three of these are fixed in 558; the rest need
          #      the software-breakpoint tests to assert the refusal per
          #      architecture, which is mechanical and not yet done.
          #
          #   2  REAL and unexplained, and the reason this row still matters:
          #        - a `pthread_create` fixture exposes ONE thread, not two;
          #        - an unwound frame reports a pc in no loaded module.
          #      Neither reproduces on x86, and no machine here can run ARM
          #      Linux, so this job is the only place they are visible.
          # MEASURED on 1c70fff, 2026-08-15: 1946 passed, 6 FAILED. The
          # paragraph that used to sit here said both "real" ones were closed
          # by 559 and 560 and that this row "should now be green". It was a
          # prediction written in the present tense, and the hardware says
          # otherwise -- BOTH are still failing:
          #
          #   REAL  an unwound frame pc is PAC-signed (0x31ab6b12435c0c) and
          #         falls inside no loaded module. 559 stripped PAC in the
          #         SHARED unwinder; this path does not go through it.
          #   REAL  the pthread_create fixture still exposes ONE thread.
          #   test  `al must derive from the live rax` and `unknown register
          #         rip` x2 -- asserted on a register set publishing x0-x30.
          #   test  run_to_return plants a breakpoint at an unaligned address
          #         and meets the alignment refusal, which is the defence
          #         working correctly against a test written for x86.
          #
          # The flag stays until those six are closed. Not because the row is
          # expected to be green, but because it is measured to be red for
          # reasons that are written down. The lesson recorded in STATUS.md:
          # never annotate a row with what it should do -- only with what it
          # did.
          - os: ubuntu-24.04-arm
            name: Linux aarch64 (attesa verde — flag da togliere se lo e)
            expected_to_fail: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same reason the macOS workflow pins it: pyo3 0.23 caps at Python 3.13,
      # and rustre-mcp-tools pulls it in through two crates, so whichever Python
      # a runner image happens to ship decides whether the workspace builds.
      - name: Pin Python to a version PyO3 0.23 supports
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Show host facts
        run: |
          echo "arch:   $(uname -m)"
          echo "kernel: $(uname -r)"
          echo "rustc:  $(rustc -vV | tr '\n' ' ')"
          echo "yama ptrace_scope: $(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo n/a)"

      # ptrace_scope=1 (the Ubuntu default) forbids attaching to a process that
      # is not a descendant, which several live tests do. Relaxing it is what
      # makes those tests meaningful rather than skipped — and printing the
      # value above means a future runner image change is visible, not silent.
      - name: Allow ptrace attach for the live tests
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Build (release)
        run: cargo build --release -p rustre-debug

      # `--test-threads=1` is not optional here: several tests drive a real
      # traced process, and two of those in parallel fight over the same debug
      # registers and wait queues.
      - name: Test (release, serial)
        run: cargo test --release -p rustre-debug --lib -- --test-threads=1

      - name: Test rustre-mcp-tools
        run: cargo test --release -p rustre-mcp-tools --lib

      - name: Clippy (informational)
        continue-on-error: true
        run: cargo clippy --release -p rustre-debug -- -W clippy::all

  summary:
    name: Linux verified
    runs-on: ubuntu-latest
    needs: linux
    if: always()
    steps:
      - name: Report
        run: |
          echo "linux job result: ${{ needs.linux.result }}"
          echo ""
          echo "The aarch64 row is allowed to fail while the register port is"
          echo "outstanding; its result is visible in the job list above and is"
          echo "the measurement this workflow was added to take."
          #
          # `= success`, not `!= failure`.
          #
          # Measured on 3e8cb04: the x86_64 row was CANCELLED by the timeout and
          # this summary reported SUCCESS, because "cancelled" is not "failure".
          # A job that never finished had been signed off as passing — the same
          # shape as a job that sits queued forever and is therefore never red.
          # The absence of a failure is not the presence of a pass.
          # `needs.linux.result` is NOT enough, measured on 1c70fff: the
          # aarch64 row was FAILURE and this job reported success, because a
          # `continue-on-error` row's failure never reaches the needs result.
          #
          # That is the 556 defect one level further out. There the hole was
          # "cancelled is not failure"; here it is "a tolerated failure is not
          # a failure". Both let a job that did not pass be signed off as
          # passing, which is the one thing this summary exists to prevent.
          #
          # So the row is queried DIRECTLY and its result printed, whatever it
          # is. The `exit 0` is deliberate and is the whole point of the flag:
          # the aarch64 row is allowed to be red while its defects are open.
          # What is NOT allowed is for it to be red and unreported.
          test "${{ needs.linux.result }}" = "success"

      - name: Report the aarch64 row explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"             --jq '.jobs[] | select(.name | contains("aarch64")) | "aarch64 row: \(.conclusion)"'
          echo ""
          echo "Known open on this row (measured on 1c70fff, 1946 passed / 6 failed):"
          echo "  REAL  unwound frame pc is PAC-signed and falls in no module"
          echo "  REAL  pthread_create fixture exposes 1 thread, not 2"
          echo "  test  al/rax and rip asserted on a register set that has neither"
          echo "  test  a breakpoint planted at a non-4-byte-aligned address"
          echo ""
          echo "Delete continue-on-error when those are closed -- not before,"
          echo "and never on the strength of a prediction that they should be."
