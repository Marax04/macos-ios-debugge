[package]
license.workspace = true
name = "rustre-syscalls"
version = "0.1.0"
edition = "2024"
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
mysql = { workspace = true }
parking_lot = { workspace = true }

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# The mysql crate (v25) transitively depends on older versions of ahash, base64,
# thiserror, etc. that conflict with other workspace deps.  This is a known
# upstream issue that cannot be resolved within this crate alone.
multiple_crate_versions = "allow"
