[package]
license.workspace = true
name = "rustre-sandbox-extract"
version = "0.1.0"
edition = "2024"
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
rustre-sandbox = { path = "../rustre-sandbox" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
] }

[lints.rust]
# Required: Windows process-memory enumeration uses windows-sys FFI which is
# inherently unsafe. Every unsafe block is documented with a SAFETY comment.
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
