[package]
license.workspace = true
name = "rustre-bin"
version = "0.1.0"
edition = "2024"
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[[bin]]
name = "rustre"
path = "src/main.rs"

[dependencies]
rustre-core = { path = "../rustre-core" }
rustre-arch = { path = "../rustre-arch" }
# Composition crate that installs the 19 REAL architecture backends over the
# PlaceholderArch stubs `rustre_arch::register_all_builtins` inserts. Without
# this dependency the binary links no backend at all and every disassembly
# request fails with "PlaceholderArch: no backend linked". Added 2026-08-18.
rustre-arch-registry = { path = "../rustre-arch-registry" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
crossterm = "0.28"
rustyline = "18.0.0"
rustyline-derive = "0.12.0"
dirs = "6.0.0"
rayon.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
