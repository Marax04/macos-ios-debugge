[package]
license.workspace = true
name = "rustre-threatintel"
version = "0.1.0"
edition = "2024"
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
# Enable the MySQL persistence back-end.  Disabled by default to avoid pulling
# in older transitive dependencies (rand 0.8, thiserror 1, …) that would clash
# with the workspace's newer versions and trigger multiple_crate_versions lint.
mysql-backend = ["dep:mysql"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
rusqlite = { workspace = true }
mysql = { workspace = true, optional = true }
parking_lot = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
regex = "1"

# Sub-crate hub wiring

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
