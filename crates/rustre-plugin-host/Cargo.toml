[package]
license.workspace = true
name = "rustre-plugin-host"
version = "0.1.0"
edition = "2024"
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
rustre-plugin-api = { path = "../rustre-plugin-api" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# This crate genuinely requires `unsafe` FFI for dynamic library loading
# (`dlopen`/`LoadLibraryW` and `Send`/`Sync` impls for raw handles), so the
# workspace-wide `unsafe_code = "warn"` lint is downgraded to `allow` here.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
