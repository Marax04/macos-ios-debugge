[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "RustRE — modular reverse engineering platform in Rust"
repository = "https://github.com/rustre/rustre"
readme = "README.md"
keywords = ["reverse-engineering", "disassembler", "decompiler", "binary-analysis", "security"]
categories = ["development-tools", "command-line-utilities"]
authors = ["RustRE Contributors"]

[workspace.dependencies]
md5 = { package = "md-5", version = "0.10" }
ahash = { version = "0.8", features = ["serde"] }
bytecount = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
tokio = { version = "=1.40.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7" }
tracing = "0.1"
async-trait = "0.1"
bitflags = { version = "2", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
petgraph = "0.6"
libloading = "0.8"
num-traits = "0.2"
parking_lot = "0.12"
serde_json = "1"
subtle = "2"
bincode = "1"
tempfile = "3"
mysql = "25"
dashmap = "6"
rayon = "1"
mimalloc = { version = "0.1", default-features = false }
memchr = "2"
uuid = { version = "1", features = ["v4"] }
iced-x86 = "1.21"
capstone = "0.13"
bad64 = "0.4"
goblin = "0.9"
pelite = "0.10"
gimli = "0.31"
object = "0.36"
nix = { version = "0.29", features = ["ptrace", "signal", "process", "user"] }
# unicorn-engine requires CMake + C toolchain; add locally per-crate when needed.
# unicorn-engine = "2"
# [DISABLED 2026-07-12] z3 — external Z3 SMT solver, disabled with rustre-symb-z3.
# z3 = { version = "0.12", features = ["static-link-z3"] }
yara-x = "0.9"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
pyo3 = { version = "0.23", features = ["auto-initialize"] }
rmcp = { package = "rmcp", version = "0.1", features = ["server", "client", "transport-io", "transport-sse-server"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
clap = { version = "4", features = ["derive"] }
nucleo = "0.5"
plotters = "0.3"
zip = "2"
flate2 = "1"
lz4_flex = "0.11"
zstd = "0.13"
xz2 = "0.1"
smallvec = "1"
indexmap = "2"
rustc-hash = "2"
hex = "0.4"
sha2 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
aes = "0.8"
chacha20poly1305 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }
mach2 = "0.4"
libc = "0.2"
cpp_demangle = "0.4"
rustc-demangle = "0.1"
regex = "1"
once_cell = "1"
crossbeam-channel = "0.5"
futures = "0.3"
bytes = "1"
wasmparser = "0.221"
pdb = "0.8"
addr2line = "0.22"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
criterion = { version = "0.5", features = ["html_reports"] }
serde_yaml = "0.9"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
fuser = "0.14"
# [DISABLED 2026-07-12] frida-gum — Frida native instrumentation, disabled with rustre-debug-frida.
# frida-gum = { version = "0.14", features = ["auto-download"] }
aho-corasick = "1"
zeroize = { version = "1", features = ["derive"] }
lapper = "1"
siphasher = "1"
toml = "0.8"
serde-big-array = "0.5"


[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

# Faster-than-release profile: same as release but skips fat-LTO for quick
# iteration builds.  Use with `cargo build --profile release-fast`.
[profile.release-fast]
inherits      = "release"
lto           = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
debug     = true

# [patch.crates-io] section intentionally left empty; z3-sys vendor path removed
# along with rustre-symb-z3 on 2026-07-12 (vendor/z3-sys directory absent).

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# These crates have multiple major versions coexisting as transitive dependencies
# from third-party crates (e.g. syn 1.x pulled by older proc-macro crates alongside
# syn 2.x; thiserror 1.x pulled by older ecosystem crates alongside our thiserror 2;
# ahash 0.7 pulled by older hashbrown; getrandom/r-efi/base64/core-foundation split
# across minor/major boundaries by indirect deps). Unifying these requires upstream
# crate updates outside this workspace.
multiple_crate_versions = "allow"
